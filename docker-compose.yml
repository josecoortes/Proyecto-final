services:
  workspace:
    build: .
    container_name: entorno_trabajo
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
      - "4200:4200"
    command: sh -c "php backend/artisan serve --host=0.0.0.0 --port=8000 & cd frontend && PORT=4200 npm run serve:ssr:frontend"
    restart: always
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: base_datos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: proyecto_db
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data: