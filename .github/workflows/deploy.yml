name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    # --- PASO 1: COMPILAR EN GITHUB ---
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm run build

    # --- PASO 2: EMPAQUETAR TODO (Método Ultra Rápido) ---
    - name: Create Deployment Package
      run: |
        tar --exclude='backend/vendor' --exclude='frontend/node_modules' --exclude='.git' -czf deployment.tar.gz backend/ frontend/dist/ nginx/ docker-compose.yml Dockerfile

    # --- PASO 3: ENVIAR EL PAQUETE ---
    - name: Copy Package via SSH
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "deployment.tar.gz"
        target: "~/Proyecto-final"

    # --- PASO 4: DESCOMPRIMIR Y ARRANCAR EN AWS ---
    - name: Execute Docker Compose
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/Proyecto-final
          
          # Extraemos los archivos
          tar -xzf deployment.tar.gz
          
          # 1. Ajustamos la URL de la aplicación
          sed -i 's|APP_URL=http://localhost|APP_URL=http://54.160.77.44|g' backend/.env

          # 2. Limpieza de puertos en el host
          sudo systemctl stop nginx || true
          sudo systemctl stop apache2 || true
          sudo fuser -k 80/tcp || true

          # 3. Desplegamos con Docker Compose
          docker-compose down
          docker-compose up -d --build

          # 4. Aseguramos que la base de datos tenga los datos
          sleep 15
          docker exec entorno_trabajo php backend/artisan migrate:fresh --seed --force
