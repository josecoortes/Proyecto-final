name: Deploy to EC2 (Front & Back Separados)

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Limpiar archivos con permisos root antes de copiar (Backend)
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_BACKEND_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo rm -rf ~/Proyecto-final/backend/public/build || true
          sudo chown -R ubuntu:ubuntu ~/Proyecto-final || true

    - name: Copy files via SSH (Backend)
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_BACKEND_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: ".,!frontend/node_modules,!backend/vendor,!.git,!.angular"
        target: "~/Proyecto-final"
        overwrite: true

    - name: Execute Docker Compose (Backend)
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_BACKEND_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/Proyecto-final
          
          cat << 'EOF' > backend/.env
          APP_NAME=Laravel
          APP_ENV=production
          APP_KEY=base64:mI+0g9Y4DznAxRNUg0DqaI9SabqOb72GQ7OaLCQoPOM=
          APP_DEBUG=false
          APP_URL=https://burguermarina.duckdns.org
          FRONTEND_URL=https://burguermarina.duckdns.org

          DB_CONNECTION=mysql
          DB_HOST=db
          DB_PORT=3306
          DB_DATABASE=proyecto_db
          DB_USERNAME=root
          DB_PASSWORD=root

          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_SECURE_COOKIE=true
          EOF

          docker compose -f docker-compose.back.yml down
          docker compose -f docker-compose.back.yml up -d --build
          
          sleep 40
          # Asegurar permisos de escritura en storage (necesario para sesiones en file driver)
          docker exec entorno_trabajo chmod -R 777 /var/www/html/backend/storage
          # Limpiar y reconstruir la caché de configuración con el nuevo .env
          docker exec entorno_trabajo php backend/artisan config:clear
          docker exec entorno_trabajo php backend/artisan cache:clear
          # Solo ejecutar migraciones pendientes
          docker exec entorno_trabajo php backend/artisan migrate --force
          # Asegurar que el usuario admin siempre existe (updateOrCreate: seguro y sin duplicados)
          docker exec entorno_trabajo php backend/artisan db:seed --class=AdminSeeder --force

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Copy files via SSH (Frontend)
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_FRONTEND_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: ".,!frontend/node_modules,!backend/vendor,!.git,!.angular"
        target: "~/Proyecto-final"

    - name: Execute Docker Compose (Frontend)
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_FRONTEND_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/Proyecto-final
          docker compose -f docker-compose.front.yml down
          docker compose -f docker-compose.front.yml up -d --build
