name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Copy files via SSH
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        # Versión de emergencia: ignoramos las carpetas pesadas para que no se cuelgue
        source: ".,!frontend/node_modules,!backend/vendor,!.git,!.angular"
        target: "~/Proyecto-final"

    - name: Execute Docker Compose
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/Proyecto-final
          # Paramos y arrancamos
          docker-compose down
          docker-compose up -d --build
          
          # Aseguramos el admin
          sleep 15
          docker exec entorno_trabajo php backend/artisan migrate:fresh --seed --force
