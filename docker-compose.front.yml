services:
  frontend_node:
    build: .
    container_name: angular_ssr
    volumes:
      - .:/var/www/html
    command: sh -c "cd frontend && npm install && npm run build && PORT=4200 HOST=0.0.0.0 npm run serve:ssr:frontend"
    restart: always

  nginx:
    image: nginx:latest
    container_name: servidor_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend_node
