services:
  frontend_node:
    build: .
    container_name: angular_ssr
    volumes:
      - .:/var/www/html
    command: sh -c "cd frontend && PORT=4200 npm run serve:ssr:frontend"
    restart: always

  nginx:
    image: nginx:latest
    container_name: servidor_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend_node
