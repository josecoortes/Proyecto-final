openapi: 3.0.3
info:
  title: Burguer Marina API
  description: |
    API REST de la plataforma **Burguer Marina** — sistema integral de gestión de pedidos para restaurante de comida rápida.
    
    ## Autenticación
    La API usa **Laravel Sanctum** con tokens Bearer. Para endpoints protegidos, incluye el token en la cabecera:
    ```
    Authorization: Bearer {tu_token}
    ```
    
    ## Roles de usuario
    - `cliente` — puede consultar la carta, hacer pedidos y ver su historial
    - `cajero` — accede al panel web de logística (Blade)
    - `repartidor` — accede al panel web de reparto (Blade)
    - `gestor` — accede al dashboard financiero (Blade)
    - `admin` — acceso completo a todos los paneles
    
  version: "1.0.0"
  contact:
    name: Nicolás Jiménez & Jose Cortés
    url: https://burguermarina.duckdns.org
  license:
    name: MIT

servers:
  - url: https://burguermarina.duckdns.org/api
    description: Servidor de Producción (AWS)
  - url: http://localhost:8000/api
    description: Servidor de Desarrollo Local

tags:
  - name: Autenticación
    description: Registro e inicio de sesión de usuarios
  - name: Platos
    description: Consulta de la carta del restaurante
  - name: Pedidos
    description: Gestión de pedidos del usuario autenticado
  - name: Pagos
    description: Integración con pasarela de pago Stripe
  - name: Comentarios
    description: Reseñas y comentarios del restaurante

paths:
  # ─── AUTENTICACIÓN ───────────────────────────────────────────────────────────
  /register:
    post:
      tags:
        - Autenticación
      summary: Registrar nuevo usuario
      description: Crea una cuenta de cliente y devuelve un token de acceso Bearer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: "Nicolás Jiménez"
                email:
                  type: string
                  format: email
                  example: "nico@example.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: "Debe contener mayúsculas, minúsculas, números y un símbolo"
                  example: "Secreta123!"
      responses:
        "201":
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422":
          description: Error de validación (email duplicado, contraseña débil, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Valida las credenciales y devuelve un token Bearer válido para el resto de endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "nico@example.com"
                password:
                  type: string
                  format: password
                  example: "Secreta123!"
      responses:
        "200":
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login inválido. Revisa tus credenciales."

  # ─── PLATOS ──────────────────────────────────────────────────────────────────
  /platos:
    get:
      tags:
        - Platos
      summary: Listar todos los platos
      description: Devuelve la carta completa del restaurante. Endpoint público, no requiere autenticación.
      responses:
        "200":
          description: Lista de platos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plato"
    post:
      tags:
        - Platos
      summary: Crear un nuevo plato (Admin/Empleado)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatoInput"
      responses:
        "201":
          description: Plato creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /platos/{id}:
    get:
      tags:
        - Platos
      summary: Ver detalle de un plato
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Detalle del plato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Platos
      summary: Actualizar un plato (Admin/Empleado)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatoInput"
      responses:
        "200":
          description: Plato actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Platos
      summary: Eliminar un plato (Admin/Empleado)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Plato eliminado correctamente
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── PEDIDOS ─────────────────────────────────────────────────────────────────
  /pedidos:
    get:
      tags:
        - Pedidos
      summary: Listar pedidos del usuario autenticado
      description: Devuelve todos los pedidos del cliente ordenados del más reciente al más antiguo.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pedido"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Pedidos
      summary: Crear un pedido (pago en efectivo)
      description: Crea un pedido para pagar en caja. Para pago con tarjeta, usar `/crear-sesion-pago`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoInput"
      responses:
        "201":
          description: Pedido creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ─── PAGOS STRIPE ────────────────────────────────────────────────────────────
  /crear-sesion-pago:
    post:
      tags:
        - Pagos
      summary: Iniciar sesión de pago con Stripe Checkout
      description: |
        Crea un pedido preliminar en la base de datos y devuelve la URL de Stripe Checkout 
        para redirigir al usuario a la pasarela de pago. 
        
        Si el pago es exitoso, Stripe redirige a `/pago-exito?session_id=...&pedido_id=...`.
        Si se cancela, redirige a `/pago-cancelado`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoInput"
      responses:
        "200":
          description: Sesión de Stripe creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "cs_test_a1b2c3..."
                    description: ID de la sesión de Stripe
                  url:
                    type: string
                    format: uri
                    example: "https://checkout.stripe.com/c/pay/cs_test_..."
                    description: URL a la que redirigir al usuario para completar el pago
        "401":
          $ref: "#/components/responses/Unauthorized"

  /confirmar-pago:
    post:
      tags:
        - Pagos
      summary: Confirmar pago exitoso con Stripe
      description: |
        Verifica con la API de Stripe que el pago se ha completado y actualiza el estado 
        del pedido a `pagado`. Se llama automáticamente desde la pantalla `/pago-exito`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, pedido_id]
              properties:
                session_id:
                  type: string
                  example: "cs_test_a1b2c3..."
                pedido_id:
                  type: integer
                  example: 42
      responses:
        "200":
          description: Pago confirmado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Pago confirmado correctamente"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── COMENTARIOS ─────────────────────────────────────────────────────────────
  /comentarios:
    get:
      tags:
        - Comentarios
      summary: Listar comentarios públicos
      description: Devuelve todas las reseñas del restaurante. Endpoint público.
      responses:
        "200":
          description: Lista de comentarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comentario"
    post:
      tags:
        - Comentarios
      summary: Publicar un comentario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto, valoracion]
              properties:
                texto:
                  type: string
                  example: "Las hamburguesas están brutales, repetiré seguro."
                valoracion:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
      responses:
        "201":
          description: Comentario publicado
        "401":
          $ref: "#/components/responses/Unauthorized"

# ─── COMPONENTES REUTILIZABLES ────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token obtenido de /api/login o /api/register"

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID numérico del recurso

  responses:
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Unauthenticated."
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "No query results for model."
    ValidationError:
      description: Error de validación de datos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

  schemas:
    AuthResponse:
      type: object
      properties:
        message:
          type: string
          example: "¡Hola de nuevo Nicolás!"
        access_token:
          type: string
          example: "1|aBcDeFgHiJkLmNoPqRsTuVwXyZ..."
        token_type:
          type: string
          example: "Bearer"
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Nicolás Jiménez"
        email:
          type: string
          format: email
          example: "nico@example.com"
        rol:
          type: string
          enum: [cliente, cajero, repartidor, gestor, empleado, admin]
          example: "cliente"

    Plato:
      type: object
      properties:
        id:
          type: integer
          example: 3
        nombre:
          type: string
          example: "Marina Smash Burger"
        descripcion:
          type: string
          example: "Doble smash de ternera con queso americano y salsa secreta"
        precio:
          type: number
          format: float
          example: 9.95
        imagen:
          type: string
          format: uri
          example: "https://example.com/imagen.jpg"
        categoria:
          type: string
          example: "Hamburguesas"

    PlatoInput:
      type: object
      required: [nombre, precio]
      properties:
        nombre:
          type: string
          example: "Marina Smash Burger"
        descripcion:
          type: string
          example: "Doble smash con queso americano"
        precio:
          type: number
          example: 9.95
        imagen:
          type: string
          format: uri
        categoria:
          type: string
          example: "Hamburguesas"

    Pedido:
      type: object
      properties:
        id:
          type: integer
          example: 42
        fecha:
          type: string
          format: date
          example: "2026-05-17"
        hora:
          type: string
          example: "21:30:00"
        estado:
          type: string
          enum: [pendiente, preparando, listo, en_reparto, entregado, cancelado]
          example: "preparando"
        metodo_entrega:
          type: string
          enum: [recoger, domicilio]
          example: "domicilio"
        direccion:
          type: string
          nullable: true
          example: "Calle Marina 12, 3ºB"
        metodo_pago:
          type: string
          enum: [efectivo, tarjeta]
          example: "tarjeta"
        cliente:
          type: string
          example: "Nicolás Jiménez"
        platos:
          type: array
          items:
            type: object
            properties:
              nombre:
                type: string
                example: "Marina Smash Burger"
              cantidad:
                type: integer
                example: 2
              precio_unitario:
                type: number
                example: 9.95

    PedidoInput:
      type: object
      required: [platos, metodo_entrega, metodo_pago]
      properties:
        metodo_entrega:
          type: string
          enum: [recoger, domicilio]
          example: "domicilio"
        direccion_empresa:
          type: string
          description: "Obligatorio si metodo_entrega es 'domicilio'"
          example: "Calle Marina 12, 3ºB"
        metodo_pago:
          type: string
          enum: [efectivo, tarjeta]
          example: "efectivo"
        platos:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, cantidad]
            properties:
              id:
                type: integer
                example: 3
              cantidad:
                type: integer
                minimum: 1
                example: 2

    Comentario:
      type: object
      properties:
        id:
          type: integer
          example: 7
        texto:
          type: string
          example: "Las hamburguesas están brutales"
        valoracion:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        usuario:
          type: string
          example: "Nicolás J."
        fecha:
          type: string
          format: date
          example: "2026-05-17"

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: "The given data was invalid."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ["El campo email ya está registrado."]
            password: ["La contraseña debe tener al menos 8 caracteres."]
