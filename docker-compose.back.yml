services:
  workspace:
    build: .
    container_name: entorno_trabajo
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    command: sh -c "cd backend && composer install && php artisan serve --host=0.0.0.0 --port=8000"
    restart: always
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: base_datos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: proyecto_db
    ports:
      - "3306:3306"
